type Secret {
  name: String!
  namespace: String!
  labels: Map
  data: Map
  type: String
  instance: Instance
  component: Component
  application: Application
  cluster: Cluster!
  createdAt: Time!
  lastModified: Time!
}

extend type Query {
  """
  requires `read:cluster_resource` or above.
  """
  Secret(cluster: ID!, namespace: String!, name: String!): Secret!
  """
  requires `read:cluster_resource` or above.

  Filters:

  - `name`

  - `namespace`

  - `type`

  - `application`

  - `component`

  - `instance`

  - `cluster`

  - `organization`
  """
  Secrets(filters: [QueryFilter!] = []): [Secret!]
}

extend type Mutation {
  """
  requires `write:cluster_resource` or above.
  """
  CreateSecret(input: CreateSecret!): Secret!
  """
  requires `write:cluster_resource` or above.
  """
  UpdateSecret(input: UpdateSecret!): Secret!
  """
  requires `modify:cluster_resource` or above.
  """
  DeleteSecret(input: DeleteSecret!): Secret!
}

input CreateSecret {
  name: String!
  namespace: String!
  data: Map!
  type: String! = "Opaque"
  cluster: ID!
}

input UpdateSecret {
  name: String!
  namespace: String!
  data: Map
  cluster: ID!
}

input DeleteSecret {
  name: String!
  namespace: String!
  cluster: ID!
}