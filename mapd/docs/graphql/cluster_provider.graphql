type ClusterProvider {
  id: ID!
  name: String!
  description: String!
  class: ClusterClass!
  spec: ClusterProviderSpec!
  tlsCertChain: [X509Certificate!]
  """
  Filters:

  - `name`

  - `default`

  - `pushable`
  """
  imageRegistries(page: QueryPage = {}, filters: [QueryFilter!] = []): ClusterProviderImageRegistries!
  loadBalancer: LoadBalancer
  organization: Organization!
  createdAt: Time!
  lastModified: Time!
}

type ClusterProviders {
  page: PageInfo!
  filters: [FilterInfo!]
  totalCount: Int!
  edge: ClusterProviderNodes!
}

extend type Query {
  """
  requires `read:cluster_provider` or above.
  """
  ClusterProvider(id: ID!): ClusterProvider!
  """
  requires `read:cluster_provider` or above.

  Filters:

  - `name`

  - `class`

  - `imageRegistry`

  - `loadBalancer`

  - `organization`
  """
  ClusterProviders(page: QueryPage = {}, filters: [QueryFilter!] = []): ClusterProviders!
}

extend type Mutation {
  """
  requires `write:cluster_provider` or above.
