  """
  requires `write:cluster_provider` or above.
  """
  UpdateTKG2SClusterProvider(input: UpdateTKG2SClusterProvider!): ClusterProvider!
  """
  requires `write:cluster_provider` or above.
  """
  UpdateTKG2MClusterProvider(input: UpdateTKG2MClusterProvider!): ClusterProvider!
  """
  requires `modify:cluster_provider` or above.
