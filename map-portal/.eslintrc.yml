env:
  browser: true
  es2021: true
extends:
  - standard
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
parser: '@typescript-eslint/parser'
parserOptions:
  ecmaVersion: 12
  sourceType: module
plugins:
  - '@typescript-eslint'
  - 'eslint-plugin-html'
rules: {
  "semi": 0,
  "camelcase": ["error", {"allow": ["zh_cn", "zh_tw", "given_name", "family_name"]}],
  "no-useless-constructor": 0,
  "@typescript-eslint/no-explicit-any": 0,
  "dot-notation": off
}
