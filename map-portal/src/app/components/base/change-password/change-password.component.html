<div *ngIf="opened">
  <div class="modal">
    <div class="modal-dialog" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">{{ 'NAVHEADER.CANGEPASSWD' | translate }}</h3>
            </div>
            <div class="modal-body">
              <div class="alert alert-info" role="alert">
                <div class="alert-items">
                  <div class="alert-item static">
                    <div class="alert-icon-wrapper">
                      <clr-icon class="alert-icon" shape="info-standard"></clr-icon>
                    </div>
                    <span class="alert-text">{{ 'NAVHEADER.CANGEPASSWD-PAGE.PAGEDESC' | translate }}</span>
                  </div>
                </div>
              </div>
              <form clrForm [formGroup]="passwdForm">
                <clr-password-container>
                    <label class="required clr-col-md-2">{{ 'NAVHEADER.CANGEPASSWD-PAGE.CURRENTPASSWD' | translate }}</label>
                    <input class="clr-col-md-10" clrPassword name="oldPassword" formControlName="oldPassword" type="string" required/>
                    <clr-control-error *clrIfError="'required'">{{ 'NAVHEADER.CANGEPASSWD-PAGE.CURRENTPASSWD-ERROR' | translate }}</clr-control-error>
                </clr-password-container>
                <clr-password-container>
                    <label class="required clr-col-md-2">{{ 'NAVHEADER.CANGEPASSWD-PAGE.NEWPASSWD' | translate }}</label>
                    <input class="clr-col-md-10" clrPassword name="newPassword" formControlName="newPassword" type="string" required pattern="^.*(?=.{8,})(?=.*\d)(?=.*[A-Z])(?=.*[a-z]).*$" (input)='handleValidation("newPassword", false)'
                                         (blur)='handleValidation("newPassword", true)'/>
                    <clr-control-error *ngIf="!getValidationState('newPassword')">{{ 'NAVHEADER.CANGEPASSWD-PAGE.NEWPASSWD-ERROR' | translate }}</clr-control-error>
                </clr-password-container>
                <clr-password-container>
                    <label class="required clr-col-md-2">{{ 'NAVHEADER.CANGEPASSWD-PAGE.CONFIRMPASSWD' | translate }}</label>
                    <input class="clr-col-md-10" clrPassword name="reNewPassword" formControlName="reNewPassword" type="string" required pattern="^.*(?=.{8,})(?=.*\d)(?=.*[A-Z])(?=.*[a-z]).*$" (input)='handleValidation("reNewPassword", false)'
                                         (blur)='handleValidation("reNewPassword", true)'/>
                   <clr-control-error *ngIf="!getValidationState('reNewPassword')">{{ 'NAVHEADER.CANGEPASSWD-PAGE.CONFIRMPASSWD-HELP' | translate }}</clr-control-error>
                </clr-password-container>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline" (click)="cancel();">{{ 'SHARED.PAGEACTIONS.PAGECANCEL' | translate }}</button>
              <button type="button" class="btn btn-primary"
                (click)="doUpdateUserPassword();" [disabled]="!isValid">{{ 'SHARED.PAGEACTIONS.PAGECOMFIRM' | translate }}</button>
            </div>
        </div>
    </div>
  </div>
  <div class="modal-backdrop" aria-hidden="true"></div>
</div>
