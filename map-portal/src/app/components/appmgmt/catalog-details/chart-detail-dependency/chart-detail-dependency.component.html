<div class="row flex-items-xs-center dep-container">
    <div class="col-md-12">
        <table class="table">
            <thead>
                <tr>
                    <th class="left">{{ 'APPCATALOG.CATALOG-DETAILS.DENPANDENCES-PAGE.NAME' | translate }}</th>
                    <th class="left">{{ 'APPCATALOG.CATALOG-DETAILS.DENPANDENCES-PAGE.VERSION' | translate }}</th>
                    <th class="left">{{ 'APPCATALOG.CATALOG-DETAILS.DENPANDENCES-PAGE.URL' | translate }}</th>
                </tr>
            </thead>
            <tbody *ngIf="!!dependencies">
                <tr *ngFor="let dep of dependencies">
                    <td class="left">{{dep.name}}</td>
                    <td class="left">{{dep.version}}</td>
                    <td class="left"><a href="{{dep.repository}}">{{dep.repository}}</a></td>
                </tr>
            </tbody>
            <tbody *ngIf="!dependencies">
              <tr>
                <td class="left">None</td>
                <td class="left">-</td>
                <td class="left">-</td>
              </tr>
            </tbody>
        </table>
    </div>
</div>
