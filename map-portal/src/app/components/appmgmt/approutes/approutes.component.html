<div *ngIf="authService.isLoggedIn">

  <div>
    <span class="custom-h2">{{ 'APPROUTE.ALL-ROUTES' | translate }}</span>
  </div>
  <br>

  <clr-tabs id="route-tabs" class="tabs" [class.in-overflow]="isTabLinkInOverFlow()">
      <ng-container *ngFor="let tab of tabLinkNavList;let i=index">
          <ng-container>
              <clr-tab>
                  <button [class.clear-default-active]="isDefaultTab(tab, i)" [clrTabLinkInOverflow]="tab.tabLinkInOverflow" id="{{tab.linkName}}" clrTabLink
                      routerLink="{{tab.linkName}}" routerLinkActive="active" type="button" style="outline: none;">
                      <a class="nav-link">{{tab.showTabName | translate }}</a>
                  </button>
              </clr-tab>
          </ng-container>
      </ng-container>
  </clr-tabs>
</div>
<router-outlet></router-outlet>
